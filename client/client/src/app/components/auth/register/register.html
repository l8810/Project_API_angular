<div class="login-page-container flex align-items-center justify-content-center">
  <div class="cyber-card p-4 shadow-8">
    
    <div class="header-minimal text-center mb-4">
      <div class="diamond-icon-wrapper mb-3">
        <div class="diamond-icon">
          <i class="pi pi-user-plus text-primary"></i>
        </div>
      </div>
      <h2 class="text-white text-2xl font-bold m-0 title-glow">הרשמה</h2>
      <p class="text-400 text-sm mt-1">צור חשבון חדש כדי להתחיל</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-3 p-fluid">
      
      <div class="input-field-group">
        <label class="cyber-label">שם מלא</label>
        <div class="input-with-icon">
          <input type="text" pInputText formControlName="name" [class.input-error]="isInvalid('name')" />
          <i class="pi pi-user"></i>
        </div>
        <small class="error-msg" *ngIf="isInvalid('name')">
          <i class="pi pi-exclamation-circle"></i> {{ getNameError() }}
        </small>
      </div>

      <div class="input-field-group">
        <label class="cyber-label">אימייל</label>
        <div class="input-with-icon">
          <input type="email" pInputText formControlName="email" [class.input-error]="isInvalid('email')" />
          <i class="pi pi-envelope"></i>
        </div>
        <small class="error-msg" *ngIf="isInvalid('email')">
          <i class="pi pi-exclamation-circle"></i> {{ getEmailError() }}
        </small>
      </div>

      <div class="input-field-group">
        <label class="cyber-label">סיסמה</label>
        <div class="input-with-icon">
          <p-password formControlName="password" [toggleMask]="true" [feedback]="false"
            styleClass="w-full" [minlength]="6" inputStyleClass="cyber-input-inner"
            [class.input-error]="isInvalid('password')">
          </p-password>
          <i class="pi pi-lock"></i>
        </div>
        <small class="error-msg" *ngIf="isInvalid('password')">
          <i class="pi pi-exclamation-circle"></i> {{ getPasswordError() }}
        </small>
      </div>

      <div class="server-error" *ngIf="serverError">
        <i class="pi pi-times-circle"></i> {{ serverError }}
      </div>

      <button pButton pRipple type="submit" class="add-to-cart-glow mt-2"
        [disabled]="registerForm.invalid || isLoading">
        <i class="pi pi-spin pi-spinner ml-2" *ngIf="isLoading"></i>
        <span class="w-full text-center">הרשמה</span>
      </button>

      <div class="register-hint text-center mt-3 text-sm">
        <span class="text-400">כבר רשום?</span> 
        <a routerLink="/login" class="text-primary no-underline font-semibold hover:underline">להתחברות</a>
      </div>
    </form>
  </div>
</div>
