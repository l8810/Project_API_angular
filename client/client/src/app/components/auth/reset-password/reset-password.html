<div class="reset-page-container flex align-items-center justify-content-center">
  <div class="cyber-card p-4">

    <div class="header-minimal text-center mb-4">
      <div class="key-icon mb-3">🔑</div>
      <h2 class="text-white text-2xl font-bold m-0 title-glow">איפוס סיסמה</h2>
      <p class="text-400 text-sm mt-1">הגדר סיסמה חדשה לחשבון שלך</p>
    </div>

    <!-- Token invalid / expired error (before submit) -->
    <div class="server-error mb-3" *ngIf="error && !success">
      <i class="pi pi-times-circle"></i> {{ error }}
      <div class="mt-2 text-sm">
        <a routerLink="/login" class="text-primary">חזור לכניסה</a>
      </div>
    </div>

    <!-- Success state -->
    <div class="success-block text-center" *ngIf="success">
      <div style="font-size:3rem;margin-bottom:12px;">✅</div>
      <h3 class="text-white">הסיסמה שונתה בהצלחה!</h3>
      <p class="text-400 text-sm">מועבר לדף הכניסה בעוד שניות ספורות...</p>
      <a routerLink="/login" class="text-primary text-sm">לחץ כאן אם לא הועברת אוטומטית</a>
    </div>

    <!-- Reset form -->
    <form *ngIf="!success && !error" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">

      <div class="input-field-group">
        <label class="cyber-label">סיסמה חדשה</label>
        <div class="input-with-icon">
          <p-password formControlName="password" [toggleMask]="true" [feedback]="false"
                      styleClass="w-full" inputStyleClass="cyber-input-inner"
                      [class.input-error]="isInvalid('password')">
          </p-password>
          <i class="pi pi-lock"></i>
        </div>
        <small class="error-msg" *ngIf="isInvalid('password')">
          <i class="pi pi-exclamation-circle"></i> {{ getPasswordError() }}
        </small>
      </div>

      <div class="input-field-group">
        <label class="cyber-label">אימות סיסמה</label>
        <div class="input-with-icon">
          <p-password formControlName="confirmPassword" [toggleMask]="true" [feedback]="false"
                      styleClass="w-full" inputStyleClass="cyber-input-inner"
                      [class.input-error]="isInvalid('confirmPassword') || (formSubmitted && resetForm.errors?.['mismatch'])">
          </p-password>
          <i class="pi pi-lock"></i>
        </div>
        <small class="error-msg" *ngIf="isInvalid('confirmPassword') || (formSubmitted && resetForm.errors?.['mismatch'])">
          <i class="pi pi-exclamation-circle"></i> {{ getConfirmError() }}
        </small>
      </div>

      <button pButton type="submit" class="add-to-cart-glow mt-2" [disabled]="isLoading">
        <i class="pi pi-spin pi-spinner ml-2" *ngIf="isLoading"></i>
        <span>שמור סיסמה חדשה</span>
      </button>

      <div class="text-center mt-2 text-sm">
        <a routerLink="/login" class="text-400 no-underline">חזור לכניסה</a>
      </div>
    </form>

  </div>
</div>
